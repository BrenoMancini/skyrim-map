<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyrim Interactive Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header class="sb-head">
      <h1 data-i18n="title">Mapa de Skyrim</h1>
      <div class="lang-switch">
        <button data-lang="pt" class="lang-btn active">PT</button>
        <button data-lang="en" class="lang-btn">EN</button>
      </div>
    </header>

    <div class="sb-section">
      <input id="search" type="search" data-i18n-ph="search" placeholder="Buscar...">
      <div id="search-results" class="search-results hidden"></div>
    </div>

    <div class="sb-section">
      <div class="sb-row">
        <label class="chk"><input type="checkbox" id="toggle-holds" checked> <span data-i18n="holds">Territórios (Holds)</span></label>
        <label class="chk"><input type="checkbox" id="toggle-labels" checked> <span data-i18n="labels">Rótulos</span></label>
      </div>
      <div class="sb-row">
        <label data-i18n="filterHold">Filtrar por hold</label>
        <select id="hold-filter"><option value="">—</option></select>
      </div>
    </div>

    <div class="sb-section">
      <div class="sb-row sb-between">
        <strong data-i18n="layers">Camadas</strong>
        <span>
          <button class="link" id="all-on" data-i18n="allOn">todas</button> ·
          <button class="link" id="all-off" data-i18n="allOff">nenhuma</button>
        </span>
      </div>
      <div id="filters"></div>
    </div>

    <div class="sb-section">
      <div class="sb-row sb-between">
        <strong data-i18n="edit">Edição</strong>
        <label class="switch"><input type="checkbox" id="edit-mode"><span class="slider"></span></label>
      </div>
      <div id="edit-tools" class="hidden">
        <p class="hint" data-i18n="editHint">Clique no mapa pra adicionar um ponto. Arraste marcadores pra mover. Use as ferramentas no canto do mapa pra desenhar áreas.</p>
        <div class="btn-row">
          <button id="btn-export" class="btn" data-i18n="export">Exportar JSON</button>
          <button id="btn-export-changes" class="btn" data-i18n="exportChanges">Só minhas mudanças</button>
        </div>
        <div class="btn-row">
          <label class="btn file"><span data-i18n="import">Importar JSON</span><input type="file" id="btn-import" accept="application/json" hidden></label>
          <button id="btn-reset" class="btn danger" data-i18n="reset">Descartar mudanças locais</button>
        </div>
        <p class="hint small" id="change-count"></p>
      </div>
    </div>

    <footer class="sb-foot">
      <span data-i18n="footer">Mapa © Bethesda. Projeto de fãs, sem fins lucrativos.</span>
      <a id="gh-link" href="#" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </aside>

  <main id="map"></main>
  <button id="sb-toggle" aria-label="menu">☰</button>

  <div id="coords" class="coords"></div>
</div>

<!-- Edit form -->
<div id="form-backdrop" class="hidden">
  <form id="poi-form" class="poi-form">
    <h2 id="form-title" data-i18n="formNew">Novo ponto</h2>
    <input type="hidden" id="f-id">
    <input type="hidden" id="f-kind" value="point">
    <div class="grid2">
      <label><span data-i18n="category">Categoria</span><select id="f-cat"></select></label>
      <label><span data-i18n="subtype">Subtipo</span><input id="f-sub" list="sub-list" required><datalist id="sub-list"></datalist></label>
    </div>
    <div class="grid2">
      <label><span>Nome (EN)</span><input id="f-name-en" required></label>
      <label><span>Nome (PT)</span><input id="f-name-pt"></label>
    </div>
    <label><span data-i18n="hold">Hold</span><select id="f-hold"></select></label>
    <label><span data-i18n="descEn">Descrição (EN)</span><textarea id="f-desc-en" rows="2"></textarea></label>
    <label><span data-i18n="descPt">Descrição (PT)</span><textarea id="f-desc-pt" rows="2"></textarea></label>
    <label><span data-i18n="tags">Tags (separadas por vírgula)</span><input id="f-tags" placeholder="iron, silver"></label>
    <label id="f-color-row" class="hidden"><span data-i18n="color">Cor</span><input id="f-color" type="color" value="#c08a3e"></label>
    <div class="grid2" id="f-xy-row">
      <label><span>X</span><input id="f-x" type="number" step="0.1"></label>
      <label><span>Y</span><input id="f-y" type="number" step="0.1"></label>
    </div>
    <div class="btn-row end">
      <button type="button" id="f-delete" class="btn danger hidden" data-i18n="delete">Apagar</button>
      <button type="button" id="f-cancel" class="btn" data-i18n="cancel">Cancelar</button>
      <button type="submit" class="btn primary" data-i18n="save">Salvar</button>
    </div>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
